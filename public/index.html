<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YAOI — Yet another OVH Inspector</title>
  <meta name="description" content="YAOI — Yet another OVH Inspector. Live availability for OVH Eco dedicated servers, per configuration and per datacenter." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📡%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./styles.css" />
  <!-- Which mode this build is. Shipped by the server and by the static build,
       so the page never has to guess: probing for /api/* would misfire on
       GitHub Pages, whose 404 response is an HTML page. -->
  <script src="./config.js"></script>
</head>
<body>

<header class="rail" id="rail">
  <div class="mark"><span class="led" id="led"></span> YAOI<span class="expand">Yet&nbsp;another&nbsp;OVH&nbsp;Inspector</span></div>
  <span class="stat" id="s-checked">checked <b>—</b></span>
  <span class="stat hide-sm" id="s-next"></span>
  <span class="stat hide-sm" id="s-count"></span>
  <span class="stat hide-sm" id="s-cadence"></span>
  <span class="spacer"></span>
  <span class="stat" id="s-channels"></span>
  <button class="iconbtn" id="b-alerts" title="Turn on browser alerts">🔔</button>
  <button class="iconbtn" id="b-sound" title="Mute the alert sound">🔊</button>
  <button class="iconbtn" id="b-theme" title="Switch between day and night">◐</button>
  <button class="iconbtn" id="b-refresh" title="Check now">↻</button>
</header>

<!-- The delivery ladder: availability is a position on an ordered time scale,
     not a boolean. Doubles as the tier filter. -->
<section class="ladder" id="ladder" hidden>
  <div class="ladder-top">
    <h2 id="ladder-title">Delivery ladder</h2>
    <span class="hint" id="ladder-hint"></span>
  </div>
  <div class="bar" id="ladder-bar" role="group" aria-label="Filter by delivery time"></div>
  <div class="rungs" id="ladder-rungs"></div>
</section>

<section class="watches" id="watches"></section>

<div class="filters" id="filters">
  <input class="search" type="search" id="f-search" placeholder="Search model, spec, plan code…" autocomplete="off" aria-label="Search configurations" />
  <div class="fgroup"><span class="lab">Where</span><span id="f-countries" class="fgroup"></span></div>
  <div class="fgroup"><span class="lab">Disk</span><span id="f-kinds" class="fgroup"></span></div>
  <div class="fgroup"><span class="lab">Range</span><span id="f-ranges" class="fgroup"></span></div>
  <label class="tog"><input type="checkbox" id="f-noneco" /> Show non-eco ranges</label>
  <button class="btn quiet small" id="f-reset">Clear filters</button>
</div>

<div class="tscroll">
  <table class="matrix">
    <thead>
      <tr id="head-row"></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<div id="empty"></div>

<div class="tfoot" id="tfoot"></div>

<section class="panel" id="history-panel" hidden>
  <div class="panel-head">
    <h2>History</h2>
    <span id="hist-summary"></span>
    <span class="spacer"></span>
    <button class="btn quiet small" id="b-hist-toggle">Hide</button>
  </div>
  <div class="panel-body" id="hist-body"></div>
</section>

<section class="panel" id="chan-panel">
  <div class="panel-head">
    <h2>Notifications</h2>
    <span id="chan-summary"></span>
    <span class="spacer"></span>
    <button class="btn quiet small" id="b-chan-toggle">Hide</button>
  </div>
  <div id="chan-body"></div>
  <div class="note" id="chan-note"></div>
</section>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- Watch editor -->
<div class="backdrop" id="modal" hidden>
  <form class="sheet" id="watch-form" autocomplete="off">
    <div class="sheet-head">
      <h3 id="modal-title">New watch</h3>
      <button type="button" class="iconbtn" id="b-close" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label class="lab" for="w-name">What are you watching for</label>
        <input id="w-name" name="name" type="text" required maxlength="120" placeholder="e.g. Canada NVMe" />
      </div>

      <div class="field">
        <span class="lab">Where</span>
        <div class="chiprow" id="w-countries"></div>
        <span class="help">Leave all off to watch every country.</span>
      </div>

      <div class="field">
        <span class="lab">Disk</span>
        <div class="chiprow" id="w-kinds"></div>
      </div>

      <div class="field">
        <span class="lab">Range</span>
        <div class="chiprow" id="w-ranges"></div>
      </div>

      <div class="two">
        <div class="field">
          <label class="lab" for="w-ram">Least RAM (GB)</label>
          <input id="w-ram" name="minRamGB" type="number" min="0" step="8" placeholder="any" />
        </div>
        <div class="field">
          <label class="lab" for="w-cool">Wait between alerts (min)</label>
          <input id="w-cool" name="cooldownMinutes" type="number" min="0" max="1440" step="5" placeholder="0" />
        </div>
      </div>

      <div class="two">
        <div class="field">
          <label class="lab" for="w-q1">Stay quiet from</label>
          <input id="w-q1" name="quietFrom" type="time" />
        </div>
        <div class="field">
          <label class="lab" for="w-q2">until</label>
          <input id="w-q2" name="quietTo" type="time" />
        </div>
      </div>

      <div class="field">
        <span class="lab">Tell me on</span>
        <div class="chiprow" id="w-channels"></div>
        <span class="help" id="w-channels-help"></span>
      </div>

      <div class="field">
        <label class="lab" for="w-storage">Storage contains</label>
        <input id="w-storage" name="storageContains" type="text" placeholder="e.g. nvme, 1920, 24x" />
      </div>

      <div class="field">
        <label class="lab" for="w-plans">Plan codes</label>
        <input id="w-plans" name="planCodes" type="text" placeholder="e.g. 24sk202, 24sys022" />
        <span class="help">Comma-separated. Matches those exact codes only.</span>
      </div>

      <div class="checks">
        <label>
          <input type="checkbox" id="w-instock" name="inStockOnly" />
          <span><b>Only stock I can have within the hour</b><span class="cd">Ignores 24h and 72h builds.</span></span>
        </label>
        <label>
          <input type="checkbox" id="w-soon" name="includeComingSoon" />
          <span><b>Include servers marked coming soon</b><span class="cd">Not orderable yet, but worth knowing about.</span></span>
        </label>
        <label>
          <input type="checkbox" id="w-enabled" name="enabled" checked />
          <span><b>Keep checking this watch</b><span class="cd">Turn off to pause without deleting it.</span></span>
        </label>
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" class="btn danger" id="b-delete" hidden>Delete watch</button>
      <span class="grow"></span>
      <button type="button" class="btn quiet" id="b-cancel">Cancel</button>
      <button type="submit" class="btn primary">Save watch</button>
    </div>
  </form>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
